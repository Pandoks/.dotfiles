[tools]
"aqua:pimalaya/himalaya" = "latest"
"npm:playwright-core" = "latest"

[bootstrap.packages]
"brew-cask:proton-mail-bridge" = { version = "latest", adopt = true }

[bootstrap.directories."~/grok/logs"]
[bootstrap.directories."~/grok/cache/proton-mail"]
[bootstrap.directories."~/grok/config/proton-pass/pandoks"]
mode = "0700"
[bootstrap.directories."~/grok/config/proton-pass/manda"]
mode = "0700"

[dotfiles]
"~/grok/bin/grok-pass" = "../../grok/bin/grok-pass"
"~/grok/bin/grok-proton-mail" = "../../grok/bin/grok-proton-mail"
"~/grok/bin/grok-proton-drive" = "../../grok/bin/grok-proton-drive"
"~/grok/bin/grok-browser" = "../../grok/bin/grok-browser"
"~/grok/config/himalaya/config.toml" = "../../grok/config/himalaya/config.toml"
