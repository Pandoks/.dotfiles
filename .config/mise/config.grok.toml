[tools]
"aqua:pimalaya/himalaya" = "latest"
"npm:playwright-core" = "latest"

[vars]
_.file = "~/grok/.env"

[bootstrap.packages]
"brew-cask:proton-mail-bridge" = "latest"

[bootstrap.directories."~/grok/logs"]
[bootstrap.directories."~/grok/cache/proton-mail"]
[bootstrap.directories."~/grok/config/himalaya"]

[dotfiles]
"~/grok/bin/grok-browser" = "../../grok/bin/grok-browser"
"~/grok/.env.example" = "../../grok/.env.example"
"~/.config/himalaya/config.toml" = { source = "../../grok/config/himalaya/config.toml.tera", mode = "template" }
