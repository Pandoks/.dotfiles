[bootstrap.brew.taps]

[bootstrap.packages]
"brew:btop" = "latest"
"brew:mas" = "latest"
"brew:rtorrent" = "latest"
"brew:tailscale" = "latest"
"brew:tsui" = "latest"
"brew:ykman" = "latest"

"mas:937984704" = "latest" # Amphetamine
"mas:497799835" = "latest" # Xcode

"brew-cask:ghostty" = "latest"
"brew-cask:hammerspoon" = "latest"
"brew-cask:helium-browser" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"brew-cask:betterdisplay" = "latest"
"brew-cask:t3-code@nightly" = "latest"
"brew-cask:gifox" = "latest"
"brew-cask:grok-bot" = "latest"
"brew-cask:notion-calendar" = "latest"
"brew-cask:proton-drive" = "latest"
"brew-cask:proton-pass" = "latest"
"brew-cask:protonvpn" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:vlc" = "latest"
"brew-cask:yubico-authenticator" = "latest"
"brew-cask:libreoffice" = "latest"
"brew-cask:android-studio" = "latest"
"brew-cask:balenaetcher" = "latest"

[bootstrap.macos.dock]
autohide = true
show_recents = false
mru_spaces = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = false

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.hooks.pre-packages]
run = '''
script="$PWD/.config/mise/scripts/pre-packages.macos.sh"
[ -f "$script" ] || script="$HOME/.config/mise/scripts/pre-packages.macos.sh"
sh "$script"
'''

# Installs that mise can't handle itself
[bootstrap.hooks.post-packages]
run = '''
set -eu

script="$PWD/.config/mise/scripts/setup-tailscale.macos.sh"
[ -f "$script" ] || script="$HOME/.config/mise/scripts/setup-tailscale.macos.sh"
sh "$script"

brew list --formula yabai &>/dev/null || brew install asmvik/formulae/yabai

for cask in logi-options+ raycast; do
  brew list --cask "$cask" &>/dev/null || brew install --cask "$cask"
done
'''

[bootstrap.hooks.final]
run = '''
spoons="$HOME/.hammerspoon/Spoons"
mkdir -p "$spoons"
test -d "$spoons/SpoonInstall.spoon" || curl -fsSL https://github.com/Hammerspoon/Spoons/raw/master/Spoons/SpoonInstall.spoon.zip | bsdtar -xf - -C "$spoons"
'''

[dotfiles]
"~/.zprofile" = "../../.zprofile"
"~/.hammerspoon" = "../../.hammerspoon"
"~/.config/yabai/yabairc" = "../yabai/yabairc"
"~/.rtorrent.rc" = "../../.rtorrent.rc"
