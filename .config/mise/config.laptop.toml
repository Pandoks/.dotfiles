[bootstrap.packages]
"apt:acpid" = "latest"
"apt:brightnessctl" = "latest"
"pacman:acpid" = "latest"
"pacman:brightnessctl" = "latest"

[bootstrap.hooks.pre-packages]
run = '''
set -eu
if [ -f /etc/systemd/system/mise-lid-backlight.service ]; then
  if [ "$(id -u)" -eq 0 ]; then
    systemctl disable --now mise-lid-backlight.service
  else
    sudo systemctl disable --now mise-lid-backlight.service
  fi
fi
'''

[bootstrap.directories."/etc/systemd/logind.conf.d"]
mode = "0755"

[bootstrap.directories."/etc/systemd/system/acpid.service.d"]
mode = "0755"

[bootstrap.files."/etc/systemd/logind.conf.d/60-mise-laptop-power.conf"]
source = "./files/laptop/logind.conf"
mode = "0644"

[bootstrap.files."/etc/acpi/events/laptop-panel-close"]
source = "./files/laptop/laptop-panel-close"
mode = "0644"
notify = ["acpid"]

[bootstrap.files."/etc/acpi/events/laptop-panel-open"]
source = "./files/laptop/laptop-panel-open"
mode = "0644"
notify = ["acpid"]

[bootstrap.files."/etc/systemd/system/acpid.service.d/laptop-panel.conf"]
content = '''
[Service]
Environment=XDG_RUNTIME_DIR=/run/acpid-lid-backlight
Environment=LAPTOP_BACKLIGHT_DEVICE=intel_backlight
Environment="LID_QUERY=/usr/bin/busctl --timeout=2s call org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.DBus.Properties GetAll s org.freedesktop.login1.Manager"
Environment="BCTL=/usr/bin/brightnessctl -qc backlight -d"
Environment=S=/run/acpid-lid-backlight/brightnessctl/backlight
RuntimeDirectory=acpid-lid-backlight
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
'''
mode = "0644"
notify = ["acpid"]

[bootstrap.services.acpid]
enabled = true
on_change = "restart"

[bootstrap.files."/etc/systemd/system/mise-lid-backlight.service"]
state = "absent"

[bootstrap.files."/usr/local/libexec/mise-lid-backlight"]
state = "absent"

[bootstrap.files."/usr/local/libexec/mise-lid-backlight-watch"]
state = "absent"

[bootstrap.hooks.final]
run = '''
if [ "$(id -u)" -eq 0 ]; then
  systemctl kill --kill-who=main --signal=HUP systemd-logind.service
else
  sudo systemctl kill --kill-who=main --signal=HUP systemd-logind.service
fi
'''
