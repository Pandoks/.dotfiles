name: hub

services:
  artex-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_DB: artex
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - artex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: ghcr.io/jiwoochris/artex-global:latest
    depends_on:
      artex-postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex@artex-postgres:5432/artex?sslmode=disable
    ports:
      - 127.0.0.1:8787:8787
      - 127.0.0.1:8788:8788
    volumes:
      - artex-data:/app/data
    restart: unless-stopped

volumes:
  artex-pgdata:
  artex-data:
