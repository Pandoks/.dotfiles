[bootstrap.packages]
"apt:acpid" = "latest"

"pacman:acpid" = "latest"

[bootstrap.directories."/etc/systemd/logind.conf.d"]
[bootstrap.directories."/etc/systemd/system/acpid.service.d"]
[bootstrap.directories."/etc/cmdline.d"]
[bootstrap.directories."/etc/default/grub.d"]
[bootstrap.directories."/etc/sysctl.d"]
[bootstrap.directories."/usr/local/libexec"]

[bootstrap.files."/etc/systemd/logind.conf.d/60-mise-laptop-power.conf"]
content = '''
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
'''

[bootstrap.files."/etc/sysctl.d/60-mise-crash.conf"]
content = '''
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic = 10
'''

[bootstrap.files."/etc/cmdline.d/60-mise-crash.conf"]
content = '''
efi_pstore.pstore_disable=0
'''

[bootstrap.files."/etc/default/grub.d/60-mise-crash.cfg"]
content = '''
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT efi_pstore.pstore_disable=0"
'''

[bootstrap.files."/usr/local/libexec/laptop-panel"]
source = "./scripts/laptop-panel.linux.sh"
mode = "0755"

[bootstrap.files."/etc/acpi/events/laptop-panel-close"]
content = '''
event=^button/lid [^ ]+ close$
action=/usr/bin/systemd-cat -t laptop-panel /usr/local/libexec/laptop-panel close
'''
notify = ["acpid"]

[bootstrap.files."/etc/acpi/events/laptop-panel-open"]
content = '''
event=^button/lid [^ ]+ open$
action=/usr/bin/systemd-cat -t laptop-panel /usr/local/libexec/laptop-panel open
'''
notify = ["acpid"]

[bootstrap.files."/etc/systemd/system/acpid.service.d/laptop-panel.conf"]
content = '''
[Unit]
After=systemd-logind.service plymouth-quit-wait.service

[Service]
ExecStartPost=-/usr/bin/systemd-cat -t laptop-panel /usr/local/libexec/laptop-panel sync
'''
notify = ["acpid"]

[bootstrap.services.acpid]
on_change = "restart"

[bootstrap.hooks.final]
run = '''
sudo systemctl reload systemd-logind
sudo sysctl --system >/dev/null

grep -qw efi_pstore.pstore_disable=0 /proc/cmdline && exit 0
if command -v mkinitcpio >/dev/null; then
  sudo mkinitcpio -P
elif command -v update-grub >/dev/null; then
  sudo update-grub
fi
'''
