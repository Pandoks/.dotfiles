[tools]
btop = "latest"

[bootstrap.hooks.pre-packages]
run = '''
script="$HOME/.config/mise/scripts/pre-packages.linux.sh"

if [ ! -f "$script" ]; then
  script="$PWD/.config/mise/scripts/pre-packages.linux.sh"
fi

sh "$script"
'''

# Linger keeps user services running after logout and starts them at boot
[bootstrap.hooks.post-tools]
run = '''
[ -d /run/systemd/system ] || exit 0
user=$(id -un)
loginctl show-user "$user" -p Linger --value 2>/dev/null | grep -qx yes || sudo loginctl enable-linger "$user"
'''

[bootstrap.hooks.final]
run = '''
set -eu

is_laptop() {
  [ "$(systemd-detect-virt 2>/dev/null || :)" = none ] || return 1
  case "$(hostnamectl chassis 2>/dev/null || :)" in
    laptop|convertible) return 0 ;;
    desktop|server|vm|container|tablet|handset|watch|embedded) return 1 ;;
  esac

  # Unknown chassis: fall back to the firmware's DMI chassis type
  case "$(cat /sys/class/dmi/id/chassis_type 2>/dev/null || :)" in
    8|9|10|14|31|32) return 0 ;;
    ''|0|1|2) ;;
    *) return 1 ;;
  esac

  # Unknown firmware: require a lid switch and a system (not peripheral) battery
  grep -q . /proc/acpi/button/lid/*/state 2>/dev/null ||
    grep -Eq '[13579bBdDfF]$' /sys/class/input/input*/capabilities/sw 2>/dev/null ||
    return 1
  for supply in /sys/class/power_supply/*; do
    [ "$(cat "$supply/type" 2>/dev/null || :)" = Battery ] || continue
    [ "$(cat "$supply/scope" 2>/dev/null || :)" = Device ] || return 0
  done
  return 1
}

[ -d /run/systemd/system ] || exit 0
is_laptop || exit 0
systemctl is-active --quiet systemd-logind.service || exit 0

# Use the companion beside the global config, else the repo checkout copy
laptop_config="$(dirname "${MISE_GLOBAL_CONFIG_FILE:-$HOME/.config/mise/config.toml}")/config.linux-laptop.toml"
[ -f "$laptop_config" ] || laptop_config="$PWD/.config/mise/config.linux-laptop.toml"
# mise --cd / would resolve a relative path from /, so anchor it here
case "$laptop_config" in /*) ;; *) laptop_config="$PWD/$laptop_config" ;; esac
MISE_GLOBAL_CONFIG_FILE="$laptop_config" \
  mise --cd / bootstrap --yes --only packages,files,services,final-hook
'''

[bootstrap.packages]
"apt:zsh" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:extrepo" = "latest"
"apt:ca-certificates" = "latest"
"apt:tree" = "latest"
"apt:fwupd" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"

"pacman:zsh" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:ca-certificates" = "latest"
"pacman:tree" = "latest"
"pacman:fwupd" = "latest"
"pacman:ghostty" = "latest"
"pacman:ttf-hack-nerd" = "latest"
"pacman:docker" = "latest"
"pacman:containerd" = "latest"
"pacman:docker-buildx" = "latest"
"pacman:docker-compose" = "latest"
