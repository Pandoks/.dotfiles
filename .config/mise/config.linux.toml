[tools]
btop = "latest"

[bootstrap.hooks.pre-packages]
run = '''
script="$HOME/.config/mise/scripts/pre-packages.linux.sh"

if [ ! -f "$script" ]; then
  script="$PWD/.config/mise/scripts/pre-packages.linux.sh"
fi

sh "$script"
'''

# Linger keeps user services running after logout and starts them at boot
[bootstrap.hooks.post-tools]
run = '''
[ -d /run/systemd/system ] || exit 0
user=$(id -un)
loginctl show-user "$user" -p Linger --value 2>/dev/null | grep -qx yes || sudo loginctl enable-linger "$user"
'''

[bootstrap.hooks.final]
run = '''
if [ -d /run/systemd/system ]; then
  sudo systemctl enable --now fwupd-refresh.timer
fi

# Fix a misdetected laptop with: hostnamectl chassis laptop
case "$(hostnamectl chassis 2>/dev/null)" in
  laptop|convertible) ;;
  *) exit 0 ;;
esac

# Use the laptop config from the repo being bootstrapped, else ~/.config/mise
laptop_config="$PWD/.config/mise/config.linux-laptop.toml"
[ -f "$laptop_config" ] || laptop_config="$HOME/.config/mise/config.linux-laptop.toml"
MISE_GLOBAL_CONFIG_FILE="$laptop_config" mise --cd / bootstrap --yes
'''

[bootstrap.packages]
"apt:zsh" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:openssh-client" = "latest"
"apt:extrepo" = "latest"
"apt:ca-certificates" = "latest"
"apt:tree" = "latest"
"apt:build-essential" = "latest"
"apt:unzip" = "latest"
"apt:fwupd" = "latest"
"apt:tailscale" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"
"apt:monero" = "latest"

"pacman:zsh" = "latest"
"pacman:curl" = "latest"
"pacman:git" = "latest"
"pacman:openssh" = "latest"
"pacman:ca-certificates" = "latest"
"pacman:tree" = "latest"
"pacman:base-devel" = "latest"
"pacman:unzip" = "latest"
"pacman:fwupd" = "latest"
"pacman:tailscale" = "latest"
"pacman:ghostty" = "latest"
"pacman:ttf-hack-nerd" = "latest"
"pacman:docker" = "latest"
"pacman:containerd" = "latest"
"pacman:docker-buildx" = "latest"
"pacman:docker-compose" = "latest"
"pacman:monero" = "latest"

[bootstrap.directories."/etc/udev/rules.d"]

# Ledger rules from github.com/LedgerHQ/udev-rules, plus MODE on the USB device:
# monero-wallet-cli uses libusb, and uaccess skips SSH sessions
[bootstrap.files."/etc/udev/rules.d/60-mise-ledger.rules"]
content = '''
SUBSYSTEMS=="usb", ATTRS{idVendor}=="2581", ATTRS{idProduct}=="1b7c|2b7c|3b7c|4b7c", TAG+="uaccess", TAG+="udev-acl"
SUBSYSTEMS=="usb", ATTRS{idVendor}=="2c97", TAG+="uaccess", TAG+="udev-acl"
SUBSYSTEM=="usb", ATTRS{idVendor}=="2c97", MODE="0666"
KERNEL=="hidraw*", ATTRS{idVendor}=="2c97", MODE="0666"
'''
