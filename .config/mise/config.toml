[tools]
claude-code = "latest"
gh = "latest"
neovim = "0.12.4"
codex = "latest"
node = "latest"
lazygit = "latest"
vim = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
jq = "latest"
tmux = "latest"
"http:t3" = { version = "latest", prerelease = true, url = "https://github.com/pingdotgg/t3code/releases/download/v{{version}}/t3-{{version}}-linux-x64.tar.gz", platforms = { linux-x64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v{{version}}/t3-{{version}}-linux-x64.tar.gz" }, linux-arm64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v{{version}}/t3-{{version}}-linux-arm64.tar.gz" }, macos-arm64 = { url = "https://github.com/pingdotgg/t3code/releases/download/v{{version}}/t3-{{version}}-darwin-arm64.tar.gz" } }, checksum_url = "https://github.com/pingdotgg/t3code/releases/download/v{{version}}/SHA256SUMS", version_list_url = "https://api.github.com/repos/pingdotgg/t3code/releases?per_page=100", version_json_path = ".[].tag_name", version_expr = 'sortVersions(filter(versions, # contains "-nightly."))' }
tree-sitter = "latest"
ripgrep = "latest"
fastfetch = "latest"
fzf = "latest"
fd = "latest"
kubectl = "latest"
delta = "latest"
"npm:@moonshot-ai/kimi-code" = "latest"
opencode = "latest"
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }
lazydocker = "latest"
k9s = "latest"
yazi = "latest"
ffmpeg = "latest"
go = "latest"
"github:router-for-me/CLIProxyAPI" = "latest"

[settings]
minimum_release_age_excludes = ["http:t3", "claude-code", "codex", "npm:@moonshot-ai/kimi-code", "opencode", "grok"]

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.oh-my-zsh/custom/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git" }
"~/.oh-my-zsh/custom/plugins/zsh-vi-mode" = { url = "https://github.com/jeffreytse/zsh-vi-mode.git" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }

[bootstrap.user]
login_shell = "/bin/zsh"

[dotfiles]
"~/.config/mise" = "." # mise directory
"~/.miserc.toml" = "../../.miserc.toml"

"~/.zshrc" = "../../.zshrc"
"~/.fzf.zsh" = "../../.fzf.zsh"
"~/.p10k.zsh" = "../../.p10k.zsh"
"~/.tmux.conf" = "../../.tmux.conf"
"~/.vimrc" = "../../.vimrc"
"~/.gitconfig" = "../../.gitconfig"

"~/.aws/config" = "../../.aws/config"

"~/.config/fd/ignore" = "../git/ignore"
"~/.config/git/ignore" = "../git/ignore"
"~/.config/gh/config.yml" = "../gh/config.yml"
"~/.config/ghostty/config" = "../ghostty/config"
"~/.config/k9s/aliases.yaml" = "../k9s/aliases.yaml"
"~/.config/lazygit/config.yml" = "../lazygit/config.yml"
"~/.config/nvim" = "../nvim"
"~/.config/yazi" = "../yazi"

"~/.ssh/config" = "../../.ssh/config"
"~/.ssh/authorized_keys" = "../../.ssh/authorized_keys"

"~/.claude/settings.json" = "../../.claude/settings.json"
"~/.claude/statusline.sh" = "../../.claude/statusline.sh"
"~/.claude/CLAUDE.md" = "../../AGENTS.md"

"~/.codex/AGENTS.md" = "../../AGENTS.md"
"~/.codex/config.toml" = "../../.codex/config.toml"

"~/.kimi-code/AGENTS.md" = "../../AGENTS.md"

"~/.grok/AGENTS.md" = "../../AGENTS.md"

"~/.config/opencode/AGENTS.md" = "../../AGENTS.md"
